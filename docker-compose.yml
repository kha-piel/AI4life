services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      VISION_PROVIDER: ${VISION_PROVIDER:-fixture}
      ALLOW_FIXTURE_FALLBACK: ${ALLOW_FIXTURE_FALLBACK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-12}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  eval:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      VISION_PROVIDER: fixture
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./evals/reports:/app/evals/reports
    command: ["python", "evals/run_eval.py"]
